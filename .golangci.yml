version: "2"
run:
  concurrency: 4
linters:
  default: none
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/fclairamb/restruct
            - github.com/stretchr/testify
  enable:
    - asciicheck
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - err113
    - errcheck
    - exhaustive
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - mnd
    - nakedret
    - nestif
    - nilerr
    - nlreturn
    - nolintlint
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - testpackage
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
    - wsl
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - goconst
          - mnd
        path: _test\.go
      - linters:
          - revive
        path: _test\.go
        text: unused-parameter
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
